<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Глубокий Больной (DeepSick) ✨</title>
    <!-- Favicon и основные стили сайта -->
    <link rel="icon" type="image/png" href="../../images/favicon_GB.png">
    <link rel="stylesheet" href="../../style.css?v=10">
    <style>
        .chat-wrapper {
            max-width: 820px;
            margin: 20px auto;
        }

        .chat-container {
            border: 3px solid var(--border-color);
            background: var(--card-bg);
            display: flex;
            flex-direction: column;
            height: min(680px, calc(100dvh - 140px));
            min-height: 420px;
            box-shadow: 5px 5px 0px var(--border-color);
        }

        /* ===== Шапка чата ===== */
        .chat-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-bottom: 3px solid var(--border-color);
            background: #f8f9fa;
        }

        .bot-avatar {
            width: 42px;
            height: 42px;
            flex-shrink: 0;
            border: 2px solid var(--border-color);
            box-shadow: 2px 2px 0px var(--border-color);
            background: #fff;
            object-fit: cover;
        }

        .chat-title {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }

        .chat-title b { font-size: 1rem; }

        .chat-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            color: #475569;
        }

        .chat-status i {
            width: 8px;
            height: 8px;
            border: 1.5px solid var(--border-color);
            border-radius: 50%;
            background: #22c55e;
        }

        .chat-status.typing i { background: #facc15; animation: blink 0.8s infinite; }

        @keyframes blink { 50% { opacity: 0.3; } }

        .chat-header-actions {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-small {
            padding: 5px 10px;
            font-size: 0.85rem;
            box-shadow: 2px 2px 0px var(--border-color);
        }

        .btn-small:hover { box-shadow: 4px 4px 0px var(--border-color); }

        /* ===== Сообщения ===== */
        .chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
            background:
                radial-gradient(circle, #e2e8f0 1px, transparent 1px) 0 0 / 18px 18px,
                #fafafa;
        }

        .msg-row {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            animation: msg-in 0.25s ease-out both;
        }

        .msg-row.user { justify-content: flex-end; }

        @keyframes msg-in {
            from { opacity: 0; transform: translateY(8px) scale(0.97); }
        }

        .msg-avatar {
            width: 30px;
            height: 30px;
            flex-shrink: 0;
            border: 2px solid var(--border-color);
            background: #fff;
            object-fit: cover;
        }

        .message {
            max-width: 75%;
            padding: 10px 14px;
            border: 2px solid var(--border-color);
            font-size: 15px;
            line-height: 1.45;
            word-wrap: break-word;
            white-space: pre-wrap;
            box-shadow: 3px 3px 0px var(--border-color);
        }

        .message.bot { background: #fff; }
        .message.user { background: #e3f2fd; }

        .msg-time {
            display: block;
            margin-top: 4px;
            font-size: 0.7rem;
            color: #64748b;
            text-align: right;
        }

        /* «печатает...» — три прыгающие точки */
        .typing-dots {
            display: flex;
            gap: 5px;
            padding: 14px 16px;
        }

        .typing-dots span {
            width: 8px;
            height: 8px;
            border: 1.5px solid var(--border-color);
            border-radius: 50%;
            background: #fff;
            animation: dot 1s infinite ease-in-out;
        }

        .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.3s; }

        @keyframes dot {
            0%, 60%, 100% { transform: translateY(0); background: #fff; }
            30% { transform: translateY(-6px); background: #facc15; }
        }

        /* карточка перехода в Google */
        .google-card {
            margin-top: 10px;
            padding: 10px;
            border: 2px solid var(--border-color);
            background: #fffde7;
            box-shadow: 2px 2px 0px var(--border-color);
            white-space: normal;
        }

        .google-query {
            font-weight: 600;
            word-break: break-word;
        }

        .google-bar {
            height: 8px;
            margin: 8px 0;
            border: 2px solid var(--border-color);
            background: #fff;
        }

        .google-bar span {
            display: block;
            height: 100%;
            width: 0;
            background: #4285f4;
        }

        .google-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .google-card.cancelled { opacity: 0.55; }
        .google-card.cancelled .google-actions,
        .google-card.cancelled .google-bar { display: none; }

        /* ===== Подсказки и ввод ===== */
        .chat-suggestions {
            display: flex;
            gap: 8px;
            padding: 10px 12px 2px;
            overflow-x: auto;
            border-top: 3px solid var(--border-color);
            background: #fff;
            scrollbar-width: thin;
        }

        .chat-suggestions .btn {
            flex-shrink: 0;
            white-space: nowrap;
            margin-bottom: 8px;
        }

        .chat-input-area {
            display: flex;
            padding: 10px 12px 12px;
            gap: 10px;
            background: #fff;
        }

        .chat-input {
            flex: 1;
            min-width: 0;
            padding: 10px 14px;
            border: 3px solid var(--border-color);
            box-shadow: 3px 3px 0px var(--border-color);
            font-size: 15px;
            outline: none;
            font-family: inherit;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .chat-input:focus {
            background-color: #fffde7;
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0px var(--border-color);
        }

        .send-btn:disabled { opacity: 0.5; cursor: default; transform: none; }

        @media (max-width: 600px) {
            body { padding: 12px; }
            .message { max-width: 85%; }
            .chat-header .project-tag { display: none; }
            .chat-container { height: calc(100dvh - 120px); }
        }
    </style>
</head>
<body>

    <!-- Шапка в стиле главной страницы -->
    <header>
        <div class="welcome-text">
            Проект: Глубокий Больной ✨
        </div>
        <a href="../../index.html" class="btn">← На главную</a>
    </header>

    <!-- Основной блок чата -->
    <div class="chat-wrapper">
        <div class="chat-container">
            <div class="chat-header">
                <img class="bot-avatar" src="../../images/favicon_GB.png" alt="">
                <div class="chat-title">
                    <b>Глубокий Больной ✨</b>
                    <span class="chat-status" id="chatStatus"><i></i><span id="chatStatusText">в сети</span></span>
                </div>
                <div class="chat-header-actions">
                    <span class="project-tag">glubokiy_bolnoy.js</span>
                    <button class="btn btn-small" id="clearBtn" type="button" title="Очистить чат">🧹 Очистить</button>
                </div>
            </div>

            <div class="chat-messages" id="chatMessages"></div>

            <!-- Быстрые подсказки -->
            <div class="chat-suggestions" id="suggestions">
                <button class="btn btn-small" type="button">👋 Привет</button>
                <button class="btn btn-small" type="button">🤖 Что ты умеешь?</button>
                <button class="btn btn-small" type="button">😂 Расскажи шутку</button>
                <button class="btn btn-small" type="button">🧠 Интересный факт</button>
                <button class="btn btn-small" type="button">👑 Кто такой Waltika?</button>
                <button class="btn btn-small" type="button">🧩 Загадай загадку</button>
                <button class="btn btn-small" type="button">📒 Что ты обо мне знаешь?</button>
                <button class="btn btn-small" type="button">🎲 Брось кубик</button>
                <button class="btn btn-small" type="button">🔎 Что такое фотосинтез?</button>
                <button class="btn btn-small" type="button">⏰ Который час?</button>
            </div>

            <form class="chat-input-area" id="chatForm">
                <input type="text" id="userInput" class="chat-input" placeholder="Введите сообщение..." autocomplete="off" required>
                <button type="submit" class="btn send-btn" id="sendBtn">Отправить</button>
            </form>
        </div>
    </div>

    <!-- Библиотека RiveScript -->
    <script src="https://unpkg.com/rivescript@2.2.0/dist/rivescript.min.js"></script>

    <!-- Ответы бота: по одному файлу на тему (папка answers/).
         Новый файл — просто добавь сюда строчку. -->
    <script src="answers/basic.js?v=3"></script>
    <script src="answers/about_bot.js?v=1"></script>
    <script src="answers/waltika.js?v=1"></script>
    <script src="answers/waltika_legends.js?v=1"></script>
    <script src="answers/feelings.js?v=1"></script>
    <script src="answers/hobbies.js?v=1"></script>
    <script src="answers/pop_culture.js?v=1"></script>
    <script src="answers/world.js?v=1"></script>
    <script src="answers/tech.js?v=1"></script>
    <script src="answers/school.js?v=1"></script>
    <script src="answers/school_subjects.js?v=1"></script>
    <script src="answers/slang.js?v=1"></script>
    <script src="answers/life_advice.js?v=1"></script>
    <script src="answers/memory.js?v=4"></script>
    <script src="answers/riddles.js?v=1"></script>
    <script src="answers/fun.js?v=2"></script>
    <script src="answers/tools.js?v=1"></script>
    <script src="answers/fallback.js?v=1"></script>

    <!-- Движок бота -->
    <script src="glubokiy_bolnoy.js?v=5"></script>

    <!-- Работа чата -->
    <script>
        const chatMessages = document.getElementById('chatMessages');
        const chatForm = document.getElementById('chatForm');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const chatStatus = document.getElementById('chatStatus');
        const chatStatusText = document.getElementById('chatStatusText');

        const GREETING = 'Привет! Я Глубокий Больной (DeepSick) ✨ Меня создал великий Waltika.\nСпроси меня о чём угодно. А если я не знаю ответа — отправлю тебя в Google 🔎';
        const GOOGLE_DELAY = 4;   // секунд до перехода в Google

        let busy = false;
        let activeGoogle = null;  // карточка, которая сейчас отсчитывает время

        const now = () => new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
        const scrollDown = () => { chatMessages.scrollTop = chatMessages.scrollHeight; };

        function addMessage(text, sender) {
            const row = document.createElement('div');
            row.className = 'msg-row ' + sender;
            if (sender === 'bot') {
                const avatar = document.createElement('img');
                avatar.className = 'msg-avatar';
                avatar.src = '../../images/favicon_GB.png';
                avatar.alt = '';
                row.appendChild(avatar);
            }
            const bubble = document.createElement('div');
            bubble.className = 'message ' + sender;
            bubble.textContent = text;
            const time = document.createElement('span');
            time.className = 'msg-time';
            time.textContent = now();
            bubble.appendChild(time);
            row.appendChild(bubble);
            chatMessages.appendChild(row);
            scrollDown();
            return bubble;
        }

        // «печатает...»
        function showTyping() {
            const row = document.createElement('div');
            row.className = 'msg-row bot';
            row.innerHTML = '<img class="msg-avatar" src="../../images/favicon_GB.png" alt=""><div class="message bot typing-dots"><span></span><span></span><span></span></div>';
            chatMessages.appendChild(row);
            chatStatus.classList.add('typing');
            chatStatusText.textContent = 'печатает…';
            scrollDown();
            return row;
        }

        function hideTyping(row) {
            row.remove();
            chatStatus.classList.remove('typing');
            chatStatusText.textContent = 'в сети';
        }

        // Карточка «Ищу в Google» с обратным отсчётом
        function addGoogleCard(bubble, query) {
            if (activeGoogle) activeGoogle.cancel();

            const url = 'https://www.google.com/search?q=' + encodeURIComponent(query);
            const card = document.createElement('div');
            card.className = 'google-card';
            card.innerHTML = `
                <div>🔎 Ищу в Google: <span class="google-query"></span></div>
                <div class="google-bar"><span></span></div>
                <div class="google-countdown"></div>
                <div class="google-actions">
                    <button class="btn btn-small" type="button" data-go>Открыть сейчас</button>
                    <button class="btn btn-small" type="button" data-cancel>Отмена</button>
                </div>`;
            card.querySelector('.google-query').textContent = '«' + query + '»';
            bubble.insertBefore(card, bubble.querySelector('.msg-time'));
            scrollDown();

            const bar = card.querySelector('.google-bar span');
            const countdown = card.querySelector('.google-countdown');
            const start = performance.now();
            let timer = null;

            const go = () => { stop(); window.location.href = url; };
            const stop = () => { clearInterval(timer); activeGoogle = null; };
            const cancel = () => {
                stop();
                card.classList.add('cancelled');
                countdown.textContent = 'Поиск отменён.';
            };

            timer = setInterval(() => {
                const passed = (performance.now() - start) / 1000;
                bar.style.width = Math.min(100, passed / GOOGLE_DELAY * 100) + '%';
                countdown.textContent = 'Переход через ' + Math.max(0, Math.ceil(GOOGLE_DELAY - passed)) + ' сек…';
                if (passed >= GOOGLE_DELAY) go();
            }, 100);

            card.querySelector('[data-go]').addEventListener('click', go);
            card.querySelector('[data-cancel]').addEventListener('click', cancel);
            activeGoogle = { cancel };
        }

        async function send(text) {
            text = text.trim();
            if (!text || busy) return;
            if (activeGoogle) activeGoogle.cancel();   // новое сообщение отменяет поиск

            addMessage(text, 'user');
            userInput.value = '';
            busy = true;
            sendBtn.disabled = true;

            const typing = showTyping();
            const answer = window.DeepSick && window.DeepSick.ask
                ? await window.DeepSick.ask(text)
                : { text: 'Бот ещё загружается, подожди секунду...', google: null };

            // небольшая пауза, как будто бот печатает (чем длиннее ответ, тем дольше)
            const delay = Math.min(1600, 450 + answer.text.length * 12);
            await new Promise(r => setTimeout(r, delay));

            hideTyping(typing);
            const bubble = addMessage(answer.text, 'bot');
            if (answer.google) addGoogleCard(bubble, answer.google);

            busy = false;
            sendBtn.disabled = false;
            userInput.focus();
        }

        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            send(userInput.value);
        });

        // быстрые подсказки: текст без эмодзи в начале
        document.querySelectorAll('#suggestions .btn').forEach(btn => {
            btn.addEventListener('click', () => send(btn.textContent.replace(/^\S+\s/, '')));
        });

        document.getElementById('clearBtn').addEventListener('click', () => {
            if (activeGoogle) activeGoogle.cancel();
            chatMessages.innerHTML = '';
            addMessage(GREETING, 'bot');
        });

        addMessage(GREETING, 'bot');
        userInput.focus();
    </script>
</body>
</html>
