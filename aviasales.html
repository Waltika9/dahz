<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Быстрый поиск авиабилетиков</title>
</head>
<body>

    <header>
        <h1>✈️ Поиск авиабилетов</h1>
    </header>

    <hr>

    <main>
        <p style="color: red;"> ВНИМАНИЕ! Если вас зовут Мади, нажмите <a href="https://youtu.be/dQw4w9WgXcQ?si=SwMcjsZaXsHTKnhP">сюда</a>!!!</p>
        <form onsubmit="handleSearch(event)">
            
            <div>
                <label>Откуда:</label><br>
                <input type="text" value="Алматы (ALA)" disabled><br>
                <small><i>* Скоро появится больше пунктов отправления (никогда)</i></small>
            </div>
            <br>

            
            <div>
                <label for="city-input">Куда (город или страна):</label><br>
                <input type="text" id="city-input" list="cities-list" placeholder="Например: Астана, Шымкент, Стамбул" required autocomplete="off">
                
                <datalist id="cities-list"></datalist>
            </div>ф
            <br>

            
            <div>
                <label for="depart-date">Дата вылета:</label><br>
                <input type="date" id="depart-date" required>
            </div>
            <br>

            
            <div>
                <label for="return-date">Дата обратно (необязательно):</label><br>
                <input type="date" id="return-date">
            </div>
            <br>

            
            <div>
                <label for="passengers">Пассажиры:</label><br>
                <input type="number" id="passengers" value="1" min="1" max="9" required>
            </div>
            <br>

            <button type="submit">🔍 Найти дешевые билетики</button>
        </form>
    </main>

    
    <script>
        
        const CITIES_DB = {
            
            "алматы": "ALA", "астана": "NQZ", "шымкент": "CIT", "актау": "SCO",
            "атырау": "GUW", "актобе": "AKX", "караганда": "KGF", "усть-каменогорск": "UKK",
            "семей": "PLX", "павлодар": "PWQ", "тараз": "DMB", "костанай": "KSN",
            "кызылорда": "KZO", "петропавловск": "PPK", "уральск": "URA", "жезказган": "DZN",
            "талдыкорган": "TDK", "кокшетау": "KOV", "туркестан": "HSA",

            
            "стамбул": "IST", "дубай": "DXB", "москва": "MOW", "санкт-петербург": "LED",
            "ташкент": "TAS", "бишкек": "FRU", "сеул": "ICN", "пекин": "BJS",
            "бангкок": "BKK", "анталья": "AYT", "тбилиси": "TBS", "ереван": "EVN",
            "абу-даби": "AUH", "доха": "DOH", "лондон": "LON", "париж": "PAR"
        };

        
        const datalist = document.getElementById('cities-list');
        Object.keys(CITIES_DB).forEach(city => {
            const option = document.createElement('option');
            
            option.value = city.charAt(0).toUpperCase() + city.slice(1);
            datalist.appendChild(option);
        });

        
        function getLevenshteinDistance(a, b) {
            const matrix = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
            for (let i = 0; i <= a.length; i++) matrix[i][0] = i;
            for (let j = 0; j <= b.length; j++) matrix[0][j] = j;

            for (let i = 1; i <= a.length; i++) {
                for (let j = 1; j <= b.length; j++) {
                    const cost = a[i - 1] === b[j - 1] ? 0 : 1;
                    matrix[i][j] = Math.min(
                        matrix[i - 1][j] + 1,
                        matrix[i][j - 1] + 1,
                        matrix[i - 1][j - 1] + cost
                    );
                }
            }
            return matrix[a.length][b.length];
        }

        
        function findClosestIata(userInput) {
            const cleanInput = userInput.trim().toLowerCase();

            
            if (cleanInput.length === 3 && Object.values(CITIES_DB).includes(cleanInput.toUpperCase())) {
                return cleanInput.toUpperCase();
            }

            
            if (CITIES_DB[cleanInput]) {
                return CITIES_DB[cleanInput];
            }

            
            let bestMatch = null;
            let minDistance = Infinity;

            for (const city in CITIES_DB) {
                const distance = getLevenshteinDistance(cleanInput, city);
                if (distance < minDistance) {
                    minDistance = distance;
                    bestMatch = city;
                }
            }

            
            if (minDistance <= 3) {
                return CITIES_DB[bestMatch];
            }

            return null; 
        }

        
        function formatDate(dateString) {
            if (!dateString) return '';
            const [year, month, day] = dateString.split('-');
            return `${day}${month}`;
        }

        
        function handleSearch(event) {
            event.preventDefault();

            const cityInput = document.getElementById('city-input').value;
            const departDate = document.getElementById('depart-date').value;
            const returnDate = document.getElementById('return-date').value;
            const passengers = document.getElementById('passengers').value;

            
            const destinationIata = findClosestIata(cityInput);

            if (!destinationIata) {
                alert('Город не найден, выбери из списка заебал...');
                return;
            }

            
            const formattedDepart = formatDate(departDate);
            const formattedReturn = formatDate(returnDate);

            
            
            
 const finalUrl = `https://www.aviasales.kz/search/ALA${formattedDepart}${destinationIata}${formattedReturn}${passengers}`;

            
            window.open(finalUrl, '_blank');
        }
    </script>
<br>
<br>
<p style="color: rgb(211, 183, 0);"> Сайт создан без поддержки:( Ваши права не защищены. </p>

</body>
</html>
