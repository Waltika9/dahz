<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Глубокий Больной (DeepSick) ✨</title>
    <!-- Favicon и основные стили сайта -->
    <link rel="icon" type="image/png" href="../../images/favicon_GB.png">
    <link rel="stylesheet" href="../../style.css">
    <style>
        .chat-wrapper {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 10px;
        }

        .chat-container {
            border: 2px solid #000;
            background: #fff;
            display: flex;
            flex-direction: column;
            height: 550px;
            box-shadow: 4px 4px 0px #000;
        }

        .chat-header {
            padding: 12px 16px;
            border-bottom: 2px solid #000;
            background: #f8f9fa;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #fafafa;
        }

        .message {
            max-width: 75%;
            padding: 10px 14px;
            border: 2px solid #000;
            border-radius: 6px;
            font-size: 15px;
            line-height: 1.4;
            word-wrap: break-word;
            box-shadow: 2px 2px 0px #000;
        }

        .message.bot {
            align-self: flex-start;
            background-color: #fff;
        }

        .message.user {
            align-self: flex-end;
            background-color: #e3f2fd;
        }

        .chat-input-area {
            display: flex;
            border-top: 2px solid #000;
            padding: 12px;
            gap: 10px;
            background: #fff;
        }

        .chat-input {
            flex: 1;
            padding: 10px 14px;
            border: 2px solid #000;
            font-size: 15px;
            outline: none;
            font-family: inherit;
        }

        .chat-input:focus {
            background-color: #fffde7;
        }
    </style>
</head>
<body>

    <!-- Шапка в стиле главной страницы -->
    <header>
        <div class="welcome-text">
            Проект: Глубокий Больной ✨
        </div>
        <a href="../../index.html" class="btn">← На главную</a>
    </header>

    <!-- Основной блок чата -->
    <div class="chat-wrapper">
        <div class="chat-container">
            <div class="chat-header">
                <span>💬 Чат с агентом DeepSick</span>
                <span class="project-tag">glubokiy_bolnoy.js</span>
            </div>
            
            <div class="chat-messages" id="chatMessages">
                <div class="message bot">Привет! Я Глубокий Больной (DeepSick) ✨ Напиши мне что-нибудь.</div>
            </div>

            <form class="chat-input-area" id="chatForm">
                <input type="text" id="userInput" class="chat-input" placeholder="Введите сообщение..." autocomplete="off" required>
                <button type="submit" class="btn">Отправить</button>
            </form>
        </div>
    </div>

    <!-- Библиотека RiveScript -->
    <script src="https://unpkg.com/rivescript@2.2.0/dist/rivescript.min.js"></script>
    
    <!-- Логика бота -->
    <script src="glubokiy_bolnoy.js"></script>

    <!-- Работа чата -->
    <script>
        const chatMessages = document.getElementById('chatMessages');
        const chatForm = document.getElementById('chatForm');
        const userInput = document.getElementById('userInput');

        function appendMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', sender);
            msgDiv.textContent = text;
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage(text, 'user');
            userInput.value = '';

            if (window.DeepSick && window.DeepSick.ask) {
                const reply = await window.DeepSick.ask(text);
                appendMessage(reply, 'bot');
            } else {
                appendMessage('Бот еще загружается, подожди секунду...', 'bot');
            }
        });
    </script>
</body>
</html>
